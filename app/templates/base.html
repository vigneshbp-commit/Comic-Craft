<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ComicCraft - AI Comic Story Creator{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2222%22 font-size=%2222%22>💥</text></svg>">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Header Bar -->
  <header class="comic-header">
    <div class="container nav-wrap">
      <a href="/" class="brand-logo">
        <span class="logo-badge">POW!</span>
        <span class="brand-title">COMICCRAFT</span>
      </a>
      <div class="header-links">
        <a href="/">+ New Comic</a>
        <a href="/docs" target="_blank">API Docs</a>
      </div>
    </div>
  </header>

  <!-- Main Content Block -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="comic-footer">
    <div class="container">
      <p><strong>ComicCraft</strong> • Powered by Google Gemini AI & Stable Diffusion</p>
      <p style="margin-top: 6px; font-size: 0.85rem; opacity: 0.85;">Transforming ideas into vivid comic books automatically.</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
